$kind: http-request
name: Create role
url: '{{baseUrl}}role'
method: POST
order: 1000
headers:
  - key: Authorization
    value: 'Bearer {{token}}'
body:
  type: json
  content: |-
    {
      "name": "Doctor",
      "permissions": [
        "patient:read",
        "patient:write",
        "appointment:create"
      ]
    }
