$kind: http-request
method: PUT
url: '{{baseUrl}}/prescriptions/:id'
order: 4000
headers:
  - key: Authorization
    value: 'Bearer {{token}}'
  - key: Content-Type
    value: application/json
  - key: X-Idempotency-Key
    value: '{{$randomUUID}}'
pathVariables:
  - key: id
    value: '{{$randomUUID}}'
body:
  type: json
  content: |-
    {
      "medications": [
        {
          "medicationName": "Paracetamol",
          "dosage": "500mg",
          "frequency": "2 times daily",
          "duration": "5 days",
          "instructions": "Take after meals",
          "quantity": 10
        }
      ],
      "notes": "Reduced dosage as per patient response"
    }