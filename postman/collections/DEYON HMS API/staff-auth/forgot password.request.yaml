$kind: http-request
name: Forgot Password
method: POST
url: '{{baseUrl}}/staff/auth/forgot-password'
order: 11000
description: |-
  Request password reset email.
  Public endpoint - no authentication required.
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "staff@hospital.com"
    }
