$kind: http-request
name: Reset Password
method: POST
url: '{{baseUrl}}/staff/auth/reset-password'
order: 12000
description: |-
  Reset password using token from email.
  Public endpoint - no authentication required.
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "token": "reset-token-string",
      "newPassword": "NewStr0ng!Pass#2024"
    }
