$kind: http-request
method: PUT
url: '{{baseUrl}}/suppliers/:id'
order: 4000
headers:
  - key: Authorization
    value: 'Bearer {{token}}'
  - key: Content-Type
    value: application/json
pathVariables:
  - key: id
    value: '{{$randomUUID}}'
body:
  type: json
  content: |-
    {
      "name": "Updated Supplier Name",
      "contactPerson": "Jane Doe",
      "email": "jane@supplier.com",
      "phone": "+1234567891",
      "address": "456 Updated Street",
      "city": "Abuja",
      "state": "FCT",
      "country": "Nigeria",
      "description": "Updated medical supplies supplier"
    }