$kind: http-request
method: PUT
url: '{{baseUrl}}/suppliers/:id'
order: 4000
headers:
  - key: Authorization
    value: 'Bearer {{token}}'
  - key: Content-Type
    value: application/json
  - key: X-Idempotency-Key
    value: '{{$randomUUID}}'
pathVariables:
  - key: id
    value: '{{$randomUUID}}'
body:
  type: json
  content: |-
    {
      "name": "MedSupply Ltd - Updated",
      "contactPerson": "Jane Smith",
      "email": "updated@medsupply.com",
      "phone": "+234-800-123-4568",
      "address": {
        "street": "456 Updated Medical Street",
        "city": "Lagos",
        "state": "Lagos",
        "country": "Nigeria",
        "postalCode": "100002"
      },
      "supplierType": "PHARMACEUTICAL",
      "isActive": true
    }