$kind: http-request
method: POST
url: '{{baseUrl}}/suppliers'
order: 3000
headers:
  - key: Authorization
    value: 'Bearer {{token}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Sample Supplier",
      "contactPerson": "John Doe",
      "email": "john@supplier.com",
      "phone": "+1234567890",
      "address": "123 Supplier Street",
      "city": "Lagos",
      "state": "Lagos",
      "country": "Nigeria",
      "description": "Medical supplies supplier"
    }