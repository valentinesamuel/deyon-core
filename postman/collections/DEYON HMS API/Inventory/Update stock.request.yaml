$kind: http-request
method: POST
url: '{{baseUrl}}/inventory/:id/stock'
order: 6000
headers:
  - key: Authorization
    value: 'Bearer {{token}}'
  - key: Content-Type
    value: application/json
  - key: X-Idempotency-Key
    value: '{{$randomUUID}}'
pathVariables:
  - key: id
    value: '{{$randomUUID}}'
body:
  type: json
  content: |-
    {
      "quantity": 100,
      "transactionType": "IN",
      "reason": "PURCHASE",
      "batchNumber": "BATCH001",
      "expiryDate": "2025-12-31",
      "unitCost": 50,
      "supplierId": "{{$randomUUID}}",
      "notes": "Stock replenishment"
    }