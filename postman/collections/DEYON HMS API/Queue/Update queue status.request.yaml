$kind: http-request
method: PUT
url: '{{baseUrl}}/queue/:id/status'
order: 4000
headers:
  - key: Authorization
    value: 'Bearer {{token}}'
  - key: Content-Type
    value: application/json
  - key: X-Idempotency-Key
    value: '{{$randomUUID}}'
pathVariables:
  - key: id
    value: '{{$randomUUID}}'
body:
  type: json
  content: |-
    {
      "status": "IN_PROGRESS",
      "notes": "Patient called for consultation"
    }