$kind: http-request
method: PUT
url: '{{baseUrl}}/departments/:id'
order: 4000
headers:
  - key: Authorization
    value: 'Bearer {{token}}'
  - key: Content-Type
    value: application/json
  - key: X-Idempotency-Key
    value: '{{$randomUUID}}'
pathVariables:
  - key: id
    value: '{{$randomUUID}}'
body:
  type: json
  content: |-
    {
      "name": "Updated Cardiology",
      "description": "Updated heart and cardiovascular system department",
      "location": "Building A, Floor 4",
      "isActive": true
    }