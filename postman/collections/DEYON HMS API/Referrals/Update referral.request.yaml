$kind: http-request
method: PUT
url: '{{baseUrl}}/referrals/:id'
order: 4000
headers:
  - key: Authorization
    value: 'Bearer {{token}}'
  - key: Content-Type
    value: application/json
  - key: X-Idempotency-Key
    value: '{{$randomUUID}}'
pathVariables:
  - key: id
    value: '{{$randomUUID}}'
body:
  type: json
  content: |-
    {
      "referredToDepartmentId": "{{$randomUUID}}",
      "referredToDoctorId": "{{$randomUUID}}",
      "reason": "Updated specialist consultation required",
      "urgency": "URGENT",
      "clinicalNotes": "Updated: Patient requires urgent cardiology consultation",
      "expectedDate": "2024-01-18"
    }