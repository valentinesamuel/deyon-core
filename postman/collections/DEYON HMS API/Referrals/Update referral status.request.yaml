$kind: http-request
method: PUT
url: '{{baseUrl}}/referrals/:id/status'
order: 6000
headers:
  - key: Authorization
    value: 'Bearer {{token}}'
  - key: Content-Type
    value: application/json
  - key: X-Idempotency-Key
    value: '{{$randomUUID}}'
pathVariables:
  - key: id
    value: '{{$randomUUID}}'
body:
  type: json
  content: |-
    {
      "status": "ACCEPTED",
      "notes": "Referral accepted by specialist"
    }