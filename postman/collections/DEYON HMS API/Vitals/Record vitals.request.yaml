$kind: http-request
method: POST
url: '{{baseUrl}}/vitals'
order: 1000
headers:
  - key: Authorization
    value: 'Bearer {{token}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "patientId": "{{$randomUUID}}",
      "temperature": 36.5,
      "bloodPressureSystolic": 120,
      "bloodPressureDiastolic": 80,
      "heartRate": 72,
      "respiratoryRate": 16,
      "oxygenSaturation": 98,
      "weight": 70.5,
      "height": 175,
      "bmi": 23.0,
      "notes": "Normal vital signs"
    }