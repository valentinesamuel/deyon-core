$kind: http-request
method: GET
url: "{{baseUrl}}staff/:id"
examples: .resources/fetch one staff.resources/examples
order: 2000
headers:
  Authorization: Bearer {{token}}
pathVariables:
  id: "1"
queryParams:
  - key: fields
    value: firstName,email,role.name,department.alias
    disabled: true
    description: "Flat dot-notation field list. Root fields and relation fields
      (rel.col) separated by commas. Allowed root fields: id, firstName,
      lastName, email, phoneNumber, licenseNumber, specialization, isApproved,
      isActive, lastLogin, roleId, departmentId, createdAt, updatedAt"
  - key: include
    value: role,department
    disabled: true
    description: "Comma-separated relations to join (all safe fields). Allowed:
      role, department"
