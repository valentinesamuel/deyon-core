$kind: http-example
name: 404 Not Found
request:
  url: '{{baseUrl}}staff/999'
  method: GET
response:
  statusCode: 404
  statusText: Not Found
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "message": "Staff not found",
        "error": "NOT_FOUND",
        "statusCode": 404
      }