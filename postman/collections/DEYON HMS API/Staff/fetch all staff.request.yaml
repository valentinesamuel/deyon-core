$kind: http-request
name: fetch all staff
method: GET
url: "{{baseUrl}}/staff?withTotal=true&fields[root]=id,firstName&fields[role]=i\
  d,name"
examples: .resources/fetch all staff.resources/examples
order: 1000
headers:
  Authorization: Bearer {{token}}
queryParams:
  - key: withTotal
    value: "true"
    description: Add total records
  - key: fields[root]
    value: id,firstName
  - key: fields[role]
    value: id,name
