$kind: http-request
method: PUT
url: '{{baseUrl}}/episodes/:id'
order: 4000
headers:
  - key: Authorization
    value: 'Bearer {{token}}'
  - key: Content-Type
    value: application/json
  - key: X-Idempotency-Key
    value: '{{$randomUUID}}'
pathVariables:
  - key: id
    value: '{{$randomUUID}}'
body:
  type: json
  content: |-
    {
      "chiefComplaint": "Updated chief complaint",
      "priority": "URGENT",
      "status": "ACTIVE"
    }