$kind: http-request
method: PUT
url: '{{baseUrl}}/appointments/:id'
order: 4000
headers:
  - key: Authorization
    value: 'Bearer {{token}}'
  - key: Content-Type
    value: application/json
  - key: X-Idempotency-Key
    value: '{{$randomUUID}}'
pathVariables:
  - key: id
    value: '{{$randomUUID}}'
body:
  type: json
  content: |-
    {
      "appointmentDate": "2024-12-31T14:00:00.000Z",
      "reason": "Follow-up consultation",
      "notes": "Rescheduled to afternoon slot"
    }