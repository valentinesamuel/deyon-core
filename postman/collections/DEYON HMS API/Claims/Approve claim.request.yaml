$kind: http-request
method: POST
url: '{{baseUrl}}/claims/:id/approve'
order: 8000
headers:
  - key: Authorization
    value: 'Bearer {{token}}'
  - key: Content-Type
    value: application/json
  - key: X-Idempotency-Key
    value: '{{$randomUUID}}'
pathVariables:
  - key: id
    value: '{{$randomUUID}}'
body:
  type: json
  content: |-
    {
      "approvedAmount": 5000,
      "notes": "Claim approved for full amount"
    }