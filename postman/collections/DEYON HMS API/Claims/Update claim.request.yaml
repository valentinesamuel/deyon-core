$kind: http-request
method: PUT
url: '{{baseUrl}}/claims/:id'
order: 4000
headers:
  - key: Authorization
    value: 'Bearer {{token}}'
  - key: Content-Type
    value: application/json
  - key: X-Idempotency-Key
    value: '{{$randomUUID}}'
pathVariables:
  - key: id
    value: '{{$randomUUID}}'
body:
  type: json
  content: |-
    {
      "claimItems": [
        {
          "serviceId": "{{$randomUUID}}",
          "quantity": 1,
          "unitPrice": 6000,
          "description": "Updated medical consultation"
        }
      ],
      "totalAmount": 6000,
      "diagnosis": "Updated diagnosis information"
    }