$kind: http-request
method: PUT
url: '{{baseUrl}}/medical-services/:id'
order: 4000
headers:
  - key: Authorization
    value: 'Bearer {{token}}'
  - key: Content-Type
    value: application/json
  - key: X-Idempotency-Key
    value: '{{$randomUUID}}'
pathVariables:
  - key: id
    value: '{{$randomUUID}}'
body:
  type: json
  content: |-
    {
      "serviceName": "General Consultation - Updated",
      "serviceCode": "GEN_CONS",
      "category": "CONSULTATION",
      "departmentId": "{{$randomUUID}}",
      "basePrice": 6000,
      "duration": 45,
      "description": "Updated general medical consultation",
      "isActive": true
    }