$kind: http-request
method: POST
url: '{{baseUrl}}/medical-services'
order: 1000
headers:
  - key: Authorization
    value: 'Bearer {{token}}'
  - key: Content-Type
    value: application/json
  - key: X-Idempotency-Key
    value: '{{$randomUUID}}'
body:
  type: json
  content: |-
    {
      "serviceName": "General Consultation",
      "serviceCode": "GEN_CONS",
      "category": "CONSULTATION",
      "departmentId": "{{$randomUUID}}",
      "basePrice": 5000,
      "duration": 30,
      "description": "General medical consultation",
      "isActive": true
    }